<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لا يوجد اتصال بالإنترنت | العربية للأجهزة</title>
<meta name="theme-color" content="#0D77BD">
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/icons_0/favicon-32x32.png" sizes="32x32">
<style>
  /* Palette mirrors Themes/Arabia/Content/css/tokens.css. Duplicated on purpose:
     this page must render with zero network requests, so it links nothing and
     inlines the logo — a <link> or <img> that missed the cache would leave the
     offline page broken exactly when it is needed. */
  :root {
    --brand-deep: #0D77BD;
    --brand: #1E8FD5;
    --brand-bright: #5BB6E8;
    --ink: #0C2536;
    --muted: #5A6B7A;
    --line: #DDE4EA;
    --surface: #ffffff;
    --surface-alt: #F2F7FB;
    --mark: #AEBECB;            /* the logo, drained of brand colour */
    --grid: rgba(13, 119, 189, .10);
    --led: #E41519;             /* the standby lamp - the mark's red */
    --ring: rgba(13, 119, 189, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E6F0F8; --muted: #93A7B8; --line: #1E3448;
      --surface: #0E1C27; --surface-alt: #080F16;
      --mark: #3C5468; --ring: rgba(91, 182, 232, .18);
      --grid: rgba(91, 182, 232, .09);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  /* Arabia sells machines, so the page it falls back to is drawn like a plan:
     a faint blueprint grid, masked to a soft centre so it never competes with
     the card. Fixed and pointer-transparent - one paint, no layout. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 30px 30px;
    -webkit-mask-image: radial-gradient(62vmax 62vmax at 50% 38%, #000 25%, transparent 72%);
    mask-image: radial-gradient(62vmax 62vmax at 50% 38%, #000 25%, transparent 72%);
  }

  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    font-family: "Noto Sans Arabic", "Dubai", "Segoe UI", Tahoma, Arial, sans-serif;
    color: var(--ink);
    background: var(--surface-alt);
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 400px;
    padding: 40px 24px 28px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 16px 40px rgba(13, 119, 189, .13);
    overflow: hidden;
  }

  /* The brand rule that runs under the site header, unbroken. It used to have a
     gap masked out of the middle to stand for the lost connection; at this size
     that read as a rendering fault rather than as a metaphor, and the logo and
     the copy already carry the message. */
  .card::before {
    content: "";
    position: absolute;
    inset-inline: 0;
    top: 0;
    height: 4px;
    background: linear-gradient(to left, var(--brand-deep) 0%, var(--brand) 55%, var(--brand-bright) 100%);
  }

  /* --- Logo -------------------------------------------------------------
     The mark is the Arabia chevron. Offline it sits in neutral grey and its two
     halves blink in turn — the store's own logo doubling as the "searching
     for a signal" indicator, so no spinner is needed. Signal rings pulse out
     from behind it and stop the moment we are back online. */
  .mark {
    position: relative;
    width: 132px;
    height: 132px;
    margin: 4px auto 22px;
    display: grid;
    place-items: center;
  }
  /* Rounded squares rather than circles: the silhouette of a control panel,
     which is what this brand actually sells. */
  .mark span {
    position: absolute;
    inset: 0;
    border-radius: 30%;
    border: 2px solid var(--ring);
    animation: ripple 2.6s ease-out infinite;
  }
  .mark span:nth-child(2) { animation-delay: .85s; }
  .mark span:nth-child(3) { animation-delay: 1.7s; }
  @keyframes ripple {
    0%   { transform: scale(.55); opacity: 0; }
    25%  { opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }

  /* Positioned so it paints above the rings, which are absolute siblings. */
  svg.logo { position: relative; width: 96px; height: 96px; display: block; }
  svg.logo path { fill: var(--mark); transition: fill .4s ease; }
  .wheel { animation: blink 1.4s ease-in-out infinite; }
  .wheel-2 { animation-delay: .35s; }
  @keyframes blink {
    0%, 100% { opacity: .35; }
    50%      { opacity: 1; }
  }

  /* Back online: the logo takes its brand colour again, everything settles. */
  body.online svg.logo .wheel { fill: #E41519; }
  body.online svg.logo .wheel-2 { fill: #0D77BD; }
  body.online .wheel { animation: none; opacity: 1; }
  body.online .mark span { animation: none; opacity: 0; }

  /* Standby lamp. Every appliance in the catalogue has one; offline, the store
     is the appliance on standby. Red and breathing while the line is down,
     solid brand blue the moment it is back. */
  .led {
    position: absolute;
    top: 18px;
    inset-inline-start: 18px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--led);
    animation: standby 2s ease-in-out infinite;
  }
  @keyframes standby {
    0%, 100% { opacity: .35; box-shadow: 0 0 0 0 rgba(228, 21, 25, 0); }
    50%      { opacity: 1;   box-shadow: 0 0 0 5px rgba(228, 21, 25, .12); }
  }
  body.online .led { animation: none; opacity: 1; background: var(--brand-deep); box-shadow: none; }

  h1 { font-size: 22px; line-height: 1.5; }
  p.lead { margin-top: 12px; font-size: 15px; line-height: 1.9; color: var(--muted); }

  button {
    font: inherit;
    font-weight: 600;
    margin-top: 26px;
    min-height: 48px;
    width: 100%;
    max-width: 260px;
    padding: 0 22px;
    border: 0;
    border-radius: 10px;
    background: var(--brand-deep);
    color: #fff;
    cursor: pointer;
    transition: background .2s ease, opacity .2s ease;
  }
  button:hover { background: #0A5F97; }
  button:active { background: #084E7C; }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible { outline: 2px solid var(--brand-deep); outline-offset: 3px; }

  .status {
    margin-top: 16px;
    min-height: 20px;
    font-size: 13px;
    color: var(--muted);
  }
  .status b { color: var(--brand-deep); font-weight: 600; }

  .tips {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    line-height: 2;
    color: var(--muted);
    text-align: start;
    list-style: none;
  }
  .tips li::before { content: "•"; color: var(--brand); margin-inline-end: 8px; }

  /* --- Recently viewed ---------------------------------------------------
     Product thumbnails live under /images/, which the service worker caches,
     so this strip paints with no network at all: the shopper lands on a store
     that still remembers what they were looking at instead of a dead end.
     Filled from localStorage, written by the theme on every product page. */
  .recent {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    text-align: start;
  }
  .recent h2 { font-size: 13px; font-weight: 600; color: var(--muted); }

  .strip {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    padding-bottom: 6px;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    scrollbar-width: thin;
    /* The strip runs to the card edge on purpose - a clipped tile is the hint
       that it scrolls. */
    margin-inline: -24px;
    padding-inline: 24px;
  }

  .tile {
    flex: 0 0 106px;
    scroll-snap-align: start;
    padding: 8px;
    text-decoration: none;
    color: inherit;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: 10px;
    transition: border-color .2s ease, transform .2s ease;
  }
  .tile:hover { border-color: var(--brand); transform: translateY(-2px); }
  .tile:focus-visible { outline: 2px solid var(--brand-deep); outline-offset: 2px; }
  .tile img {
    display: block;
    width: 100%;
    height: 74px;
    object-fit: contain;
    border-radius: 6px;
    background: var(--surface);
  }
  .tname {
    display: block;
    margin-top: 8px;
    font-size: 12px;
    line-height: 1.5;
    max-height: 3em;
    overflow: hidden;
  }
  .tprice { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--brand-deep); }

  @media (prefers-reduced-motion: reduce) {
    .mark span, .wheel, .led { animation: none; }
    .mark span { opacity: .6; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <i class="led" aria-hidden="true"></i>
    <div class="mark" aria-hidden="true">
      <span></span><span></span><span></span>
      <svg class="logo" viewBox="0 0 46.85 36.85" role="img" aria-label="العربية للأجهزة">
        <path class="wheel" d="M46.85,36.85h-16L16.3,0H32.09Z"/>
        <path class="wheel wheel-2" d="M26.22,36.85H0L13.13,3.77l5.36,13.57-2.88,8.39h6.22Z"/>
      </svg>
    </div>

    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p class="lead">تعذّر الوصول إلى المتجر. سلّتك محفوظة — وستُحدَّث هذه الصفحة تلقائيًا فور عودة الاتصال.</p>

    <button type="button" id="retry">إعادة المحاولة</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section class="recent" id="recent" hidden>
      <h2>تصفّحته مؤخرًا</h2>
      <div class="strip" id="strip"></div>
    </section>

    <ul class="tips">
      <li>تأكّد من إيقاف وضع الطيران</li>
      <li>تحقّق من الواي فاي أو بيانات الجوال</li>
      <li>انتقل إلى مكان بتغطية أفضل</li>
    </ul>
  </main>

<script>
(function () {
  var btn = document.getElementById('retry');
  var status = document.getElementById('status');
  var probing = false;

  function say(html) { status.innerHTML = html; }

  /* navigator.onLine lies (captive portals, "connected" with no route), so the
     only trustworthy signal is a request that actually completes. HEAD on the
     favicon: tiny, and the service worker leaves root-level files alone. */
  function probe() {
    if (probing) return Promise.resolve(false);
    probing = true;
    return fetch('/favicon.ico?p=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { return r.ok; })
      .catch(function () { return false; })
      .then(function (ok) { probing = false; return ok; });
  }

  function reconnected() {
    document.body.classList.add('online');
    say('<b>عاد الاتصال</b> — جارٍ تحديث الصفحة…');
    setTimeout(function () { location.reload(); }, 500);
  }

  btn.addEventListener('click', function () {
    btn.disabled = true;
    say('جارٍ التحقق من الاتصال…');
    probe().then(function (ok) {
      if (ok) return reconnected();
      btn.disabled = false;
      say('لا يزال الاتصال منقطعًا.');
    });
  });

  /* Quiet background polling, backing off 4s → 30s so a phone left on this
     page in a tunnel is not draining its battery on retries. */
  var delay = 4000;
  (function poll() {
    setTimeout(function () {
      probe().then(function (ok) {
        if (ok) return reconnected();
        delay = Math.min(delay * 1.5, 30000);
        poll();
      });
    }, delay);
  })();

  window.addEventListener('online', function () {
    probe().then(function (ok) { if (ok) reconnected(); });
  });

  if (!navigator.onLine) say('في انتظار الاتصال…');

  /* --- Recently viewed --------------------------------------------------
     Written by the theme on every product page. Anything here is data the
     page did not author, so the tiles are built with textContent and the
     href is accepted only if it is a same-origin absolute path. */
  (function recent() {
    var items;
    try { items = JSON.parse(localStorage.getItem('recently-viewed') || '[]'); }
    catch (e) { return; }
    if (!Array.isArray(items) || !items.length) return;

    var strip = document.getElementById('strip');

    items.slice(0, 6).forEach(function (x) {
      if (!x || typeof x.u !== 'string' || x.u.charAt(0) !== '/' || x.u.charAt(1) === '/') return;

      var a = document.createElement('a');
      a.className = 'tile';
      a.href = x.u;

      var img = document.createElement('img');
      img.src = x.i || '';
      img.alt = '';
      img.loading = 'lazy';

      var name = document.createElement('span');
      name.className = 'tname';
      name.textContent = x.n || '';

      var price = document.createElement('span');
      price.className = 'tprice';
      price.textContent = x.p || '';

      a.append(img, name, price);
      strip.append(a);
    });

    if (!strip.children.length) return;
    document.getElementById('recent').hidden = false;

    /* Following a tile while still offline would just land back here, which
       reads as a broken link. Probe first, and say so if nothing changed. */
    strip.addEventListener('click', function (e) {
      var a = e.target.closest('a.tile');
      if (!a) return;
      e.preventDefault();
      say('جارٍ التحقق من الاتصال…');
      probe().then(function (ok) {
        if (ok) location.href = a.href;
        else say('لا يزال الاتصال منقطعًا.');
      });
    });
  })();
})();
</script>
</body>
</html>
