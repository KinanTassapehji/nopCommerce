<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لا يوجد اتصال بالإنترنت | تمتم</title>
<meta name="theme-color" content="#02787e">
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/icons_0/favicon-32x32.png" sizes="32x32">
<style>
  /* Palette mirrors Themes/TmTm/Content/css/tokens.css. Duplicated on purpose:
     this page must render with zero network requests, so it links nothing and
     inlines the logo — a <link> or <img> that missed the cache would leave the
     offline page broken exactly when it is needed. */
  :root {
    --teal-deep: #02787e;
    --teal: #009a95;
    --teal-bright: #00d9cc;
    --ink: #10201f;
    --muted: #5c6b6a;
    --line: #dfe5e5;
    --surface: #ffffff;
    --surface-alt: #f4f8f8;
    --mark: #aebebd;            /* the logo, drained of brand colour */
    --ring: rgba(2, 120, 126, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eaf3f2; --muted: #9bb0ae; --line: #24403e;
      --surface: #12201f; --surface-alt: #0a1413;
      --mark: #405a58; --ring: rgba(0, 217, 204, .18);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  /* Two soft teal glows, the brand gradient let loose behind the card. Fixed
     and pointer-transparent, so they cost nothing but a paint. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(42vmax 42vmax at 85% -12%, rgba(0, 217, 204, .16), transparent 62%),
      radial-gradient(40vmax 40vmax at -12% 112%, rgba(2, 120, 126, .14), transparent 62%);
  }

  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    font-family: "Noto Sans Arabic", "Dubai", "Segoe UI", Tahoma, Arial, sans-serif;
    color: var(--ink);
    background: var(--surface-alt);
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 400px;
    padding: 40px 24px 28px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 16px 40px rgba(2, 120, 126, .13);
    overflow: hidden;
  }

  /* The brand rule that runs under the site header, unbroken. It used to have a
     gap masked out of the middle to stand for the lost connection; at this size
     that read as a rendering fault rather than as a metaphor, and the logo and
     the copy already carry the message. */
  .card::before {
    content: "";
    position: absolute;
    inset-inline: 0;
    top: 0;
    height: 4px;
    background: linear-gradient(to left, var(--teal-deep) 0%, var(--teal) 55%, var(--teal-bright) 100%);
  }

  /* --- Logo -------------------------------------------------------------
     The mark is the tmtm cart. Offline it sits in neutral grey and its two
     wheels blink in turn — the store's own logo doubling as the "searching
     for a signal" indicator, so no spinner is needed. Signal rings pulse out
     from behind it and stop the moment we are back online. */
  .mark {
    position: relative;
    width: 132px;
    height: 132px;
    margin: 4px auto 22px;
    display: grid;
    place-items: center;
  }
  .mark span {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--ring);
    animation: ripple 2.6s ease-out infinite;
  }
  .mark span:nth-child(2) { animation-delay: .85s; }
  .mark span:nth-child(3) { animation-delay: 1.7s; }
  @keyframes ripple {
    0%   { transform: scale(.55); opacity: 0; }
    25%  { opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }

  /* The floor the cart rolls on. A trolley suspended in mid-air reads as a
     broken image; give it ground and the blinking wheels become motion. */
  .mark::after {
    content: "";
    position: absolute;
    bottom: 14px;
    inset-inline: 10px;
    height: 2px;
    background: repeating-linear-gradient(to left, var(--line) 0 9px, transparent 9px 18px);
    animation: roll 1s linear infinite;
  }
  @keyframes roll { to { background-position-x: 18px; } }

  /* Positioned so it paints above the rings, which are absolute siblings. */
  svg.logo { position: relative; width: 96px; height: 96px; display: block; }
  svg.logo path { fill: var(--mark); transition: fill .4s ease; }
  .wheel { animation: blink 1.4s ease-in-out infinite; }
  .wheel-2 { animation-delay: .35s; }
  @keyframes blink {
    0%, 100% { opacity: .35; }
    50%      { opacity: 1; }
  }

  /* Back online: the logo takes its brand colour again, everything settles. */
  body.online svg.logo path { fill: var(--teal-deep); }
  body.online .wheel { animation: none; opacity: 1; }
  body.online .mark span { animation: none; opacity: 0; }
  body.online .mark::after { animation: none; }

  h1 { font-size: 22px; line-height: 1.5; }
  p.lead { margin-top: 12px; font-size: 15px; line-height: 1.9; color: var(--muted); }

  button {
    font: inherit;
    font-weight: 600;
    margin-top: 26px;
    min-height: 48px;
    width: 100%;
    max-width: 260px;
    padding: 0 22px;
    border: 0;
    border-radius: 14px;
    background: var(--teal-deep);
    color: #fff;
    cursor: pointer;
    transition: background .2s ease, opacity .2s ease;
  }
  button:hover { background: #01585c; }
  button:active { background: #014a4e; }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible { outline: 2px solid var(--teal-deep); outline-offset: 3px; }

  .status {
    margin-top: 16px;
    min-height: 20px;
    font-size: 13px;
    color: var(--muted);
  }
  .status b { color: var(--teal-deep); font-weight: 600; }

  .tips {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    line-height: 2;
    color: var(--muted);
    text-align: start;
    list-style: none;
  }
  .tips li::before { content: "•"; color: var(--teal); margin-inline-end: 8px; }

  /* --- Recently viewed ---------------------------------------------------
     Product thumbnails live under /images/, which the service worker caches,
     so this strip paints with no network at all: the shopper lands on a store
     that still remembers what they were looking at instead of a dead end.
     Filled from localStorage, written by the theme on every product page. */
  .recent {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    text-align: start;
  }
  .recent h2 { font-size: 13px; font-weight: 600; color: var(--muted); }

  .strip {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    padding-bottom: 6px;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    scrollbar-width: thin;
    /* The strip runs to the card edge on purpose — a clipped tile is the hint
       that it scrolls. */
    margin-inline: -24px;
    padding-inline: 24px;
  }

  .tile {
    flex: 0 0 106px;
    scroll-snap-align: start;
    padding: 8px;
    text-decoration: none;
    color: inherit;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: 14px;
    transition: border-color .2s ease, transform .2s ease;
  }
  .tile:hover { border-color: var(--teal); transform: translateY(-2px); }
  .tile:focus-visible { outline: 2px solid var(--teal-deep); outline-offset: 2px; }
  .tile img {
    display: block;
    width: 100%;
    height: 74px;
    object-fit: contain;
    border-radius: 9px;
    background: var(--surface);
  }
  .tname {
    display: block;
    margin-top: 8px;
    font-size: 12px;
    line-height: 1.5;
    max-height: 3em;
    overflow: hidden;
  }
  .tprice { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--teal-deep); }

  @media (prefers-reduced-motion: reduce) {
    .mark span, .wheel, .mark::after { animation: none; }
    .mark span { opacity: .6; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <span></span><span></span><span></span>
      <svg class="logo" viewBox="0 0 249.71 249.71" role="img" aria-label="tmtm">
        <path fill-rule="evenodd" d="M247.57 189.36C246.52 182.21 235.86 176.04 224.0 176.04L96.67 176.09C84.31 176.09 74.62 182.32 73.87 189.35L247.57 189.36Z"/>
        <path class="wheel" d="M127.77 209.3C127.77 218.01 120.71 225.07 112.0 225.07C103.29 225.07 96.22 218.01 96.22 209.3C96.22 200.59 103.29 193.52 112.0 193.52C120.71 193.52 127.77 200.59 127.77 209.3Z"/>
        <path class="wheel wheel-2" d="M223.14 209.28C223.14 217.99 216.08 225.05 207.38 225.05C198.67 225.05 191.61 217.99 191.61 209.28C191.61 200.58 198.67 193.52 207.38 193.52C216.08 193.52 223.14 200.58 223.14 209.28Z"/>
        <path fill-rule="evenodd" d="M191.7 104.23L191.33 133.76L191.05 167.52L167.92 167.47L168.26 134.4L168.21 103.96C168.2 98.3 164.12 93.75 158.76 92.55C153.97 91.48 149.25 91.57 144.43 92.26C136.93 93.33 133.53 98.69 133.35 106.33L137.44 167.48L114.31 167.49L111.84 130.11L110.45 108.59C109.35 91.57 115.69 75.3 132.86 70.62C138.81 68.99 144.73 68.56 150.95 68.72C162.19 68.42 173.64 70.96 180.02 81.05C186.72 70.68 198.39 68.43 210.36 68.71C223.87 68.45 237.27 71.5 244.39 83.54C247.66 89.05 249.57 95.18 249.63 101.59L249.71 109.44L240.5 167.51L217.38 167.48L226.42 109.05C227.36 101.0 224.28 93.82 216.32 92.4C211.56 91.54 206.78 91.5 201.97 92.38C196.26 93.43 191.78 98.1 191.7 104.23Z"/>
        <path fill-rule="evenodd" d="M87.35 143.33L103.4 143.49L104.74 167.54L86.13 167.38C78.38 167.32 71.26 163.97 66.05 158.34C61.39 153.06 59.01 146.85 57.87 139.85L43.74 52.97C43.17 49.47 39.31 47.7 36.48 47.69L11.79 47.58C4.65 47.54 0.0 40.48 1.46 33.69C2.5 28.9 6.2 24.66 11.48 24.65L39.92 24.64C49.52 24.64 57.8 30.19 62.6 38.22C65.11 42.46 66.26 46.92 67.04 51.77L69.79 68.68L100.04 68.69L100.98 91.79L73.48 91.91L80.92 137.53C81.42 140.59 84.34 143.3 87.35 143.33Z"/>
      </svg>
    </div>

    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p class="lead">تعذّر الوصول إلى المتجر. سلّتك محفوظة — وستُحدَّث هذه الصفحة تلقائيًا فور عودة الاتصال.</p>

    <button type="button" id="retry">إعادة المحاولة</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section class="recent" id="recent" hidden>
      <h2>تصفّحته مؤخرًا</h2>
      <div class="strip" id="strip"></div>
    </section>

    <ul class="tips">
      <li>تأكّد من إيقاف وضع الطيران</li>
      <li>تحقّق من الواي فاي أو بيانات الجوال</li>
      <li>انتقل إلى مكان بتغطية أفضل</li>
    </ul>
  </main>

<script>
(function () {
  var btn = document.getElementById('retry');
  var status = document.getElementById('status');
  var probing = false;

  function say(html) { status.innerHTML = html; }

  /* navigator.onLine lies (captive portals, "connected" with no route), so the
     only trustworthy signal is a request that actually completes. HEAD on the
     favicon: tiny, and the service worker leaves root-level files alone. */
  function probe() {
    if (probing) return Promise.resolve(false);
    probing = true;
    return fetch('/favicon.ico?p=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { return r.ok; })
      .catch(function () { return false; })
      .then(function (ok) { probing = false; return ok; });
  }

  function reconnected() {
    document.body.classList.add('online');
    say('<b>عاد الاتصال</b> — جارٍ تحديث الصفحة…');
    setTimeout(function () { location.reload(); }, 500);
  }

  btn.addEventListener('click', function () {
    btn.disabled = true;
    say('جارٍ التحقق من الاتصال…');
    probe().then(function (ok) {
      if (ok) return reconnected();
      btn.disabled = false;
      say('لا يزال الاتصال منقطعًا.');
    });
  });

  /* Quiet background polling, backing off 4s → 30s so a phone left on this
     page in a tunnel is not draining its battery on retries. */
  var delay = 4000;
  (function poll() {
    setTimeout(function () {
      probe().then(function (ok) {
        if (ok) return reconnected();
        delay = Math.min(delay * 1.5, 30000);
        poll();
      });
    }, delay);
  })();

  window.addEventListener('online', function () {
    probe().then(function (ok) { if (ok) reconnected(); });
  });

  if (!navigator.onLine) say('في انتظار الاتصال…');

  /* --- Recently viewed --------------------------------------------------
     Written by the theme on every product page. Anything here is data the
     page did not author, so the tiles are built with textContent and the
     href is accepted only if it is a same-origin absolute path. */
  (function recent() {
    var items;
    try { items = JSON.parse(localStorage.getItem('recently-viewed') || '[]'); }
    catch (e) { return; }
    if (!Array.isArray(items) || !items.length) return;

    var strip = document.getElementById('strip');

    items.slice(0, 6).forEach(function (x) {
      if (!x || typeof x.u !== 'string' || x.u.charAt(0) !== '/' || x.u.charAt(1) === '/') return;

      var a = document.createElement('a');
      a.className = 'tile';
      a.href = x.u;

      var img = document.createElement('img');
      img.src = x.i || '';
      img.alt = '';
      img.loading = 'lazy';

      var name = document.createElement('span');
      name.className = 'tname';
      name.textContent = x.n || '';

      var price = document.createElement('span');
      price.className = 'tprice';
      price.textContent = x.p || '';

      a.append(img, name, price);
      strip.append(a);
    });

    if (!strip.children.length) return;
    document.getElementById('recent').hidden = false;

    /* Following a tile while still offline would just land back here, which
       reads as a broken link. Probe first, and say so if nothing changed. */
    strip.addEventListener('click', function (e) {
      var a = e.target.closest('a.tile');
      if (!a) return;
      e.preventDefault();
      say('جارٍ التحقق من الاتصال…');
      probe().then(function (ok) {
        if (ok) location.href = a.href;
        else say('لا يزال الاتصال منقطعًا.');
      });
    });
  })();
})();
</script>
</body>
</html>
