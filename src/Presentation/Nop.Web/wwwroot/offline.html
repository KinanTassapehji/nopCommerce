<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لا يوجد اتصال بالإنترنت | تمتم</title>
<meta name="theme-color" content="#02787e">
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/icons_0/favicon-32x32.png" sizes="32x32">
<style>
  /* Palette mirrors Themes/TmTm/Content/css/tokens.css. Duplicated on purpose:
     this page must render with zero network requests, so it links nothing and
     inlines the logo — a <link> or <img> that missed the cache would leave the
     offline page broken exactly when it is needed. */
  :root {
    --teal-deep: #02787e;
    --teal: #009a95;
    --teal-bright: #00d9cc;
    --ink: #10201f;
    --muted: #5c6b6a;
    --line: #dfe5e5;
    --surface: #ffffff;
    --surface-alt: #f4f8f8;
    --mark: #aebebd;            /* the logo, drained of brand colour */
    --ring: rgba(2, 120, 126, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eaf3f2; --muted: #9bb0ae; --line: #24403e;
      --surface: #12201f; --surface-alt: #0a1413;
      --mark: #405a58; --ring: rgba(0, 217, 204, .18);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    font-family: "Noto Sans Arabic", "Dubai", "Segoe UI", Tahoma, Arial, sans-serif;
    color: var(--ink);
    background: var(--surface-alt);
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 400px;
    padding: 40px 24px 28px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 16px 40px rgba(2, 120, 126, .13);
    overflow: hidden;
  }

  /* The brand rule that runs under the site header, unbroken. It used to have a
     gap masked out of the middle to stand for the lost connection; at this size
     that read as a rendering fault rather than as a metaphor, and the logo and
     the copy already carry the message. */
  .card::before {
    content: "";
    position: absolute;
    inset-inline: 0;
    top: 0;
    height: 4px;
    background: linear-gradient(to left, var(--teal-deep) 0%, var(--teal) 55%, var(--teal-bright) 100%);
  }

  /* --- Logo -------------------------------------------------------------
     The mark is the tmtm cart. Offline it sits in neutral grey and its two
     wheels blink in turn — the store's own logo doubling as the "searching
     for a signal" indicator, so no spinner is needed. Signal rings pulse out
     from behind it and stop the moment we are back online. */
  .mark {
    position: relative;
    width: 132px;
    height: 132px;
    margin: 4px auto 22px;
    display: grid;
    place-items: center;
  }
  .mark span {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--ring);
    animation: ripple 2.6s ease-out infinite;
  }
  .mark span:nth-child(2) { animation-delay: .85s; }
  .mark span:nth-child(3) { animation-delay: 1.7s; }
  @keyframes ripple {
    0%   { transform: scale(.55); opacity: 0; }
    25%  { opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }

  /* Positioned so it paints above the rings, which are absolute siblings. */
  svg.logo { position: relative; width: 96px; height: 96px; display: block; }
  svg.logo path { fill: var(--mark); transition: fill .4s ease; }
  .wheel { animation: blink 1.4s ease-in-out infinite; }
  .wheel-2 { animation-delay: .35s; }
  @keyframes blink {
    0%, 100% { opacity: .35; }
    50%      { opacity: 1; }
  }

  /* Back online: the logo takes its brand colour again, everything settles. */
  body.online svg.logo path { fill: var(--teal-deep); }
  body.online .wheel { animation: none; opacity: 1; }
  body.online .mark span { animation: none; opacity: 0; }

  h1 { font-size: 22px; line-height: 1.5; }
  p.lead { margin-top: 12px; font-size: 15px; line-height: 1.9; color: var(--muted); }

  button {
    font: inherit;
    font-weight: 600;
    margin-top: 26px;
    min-height: 48px;
    width: 100%;
    max-width: 260px;
    padding: 0 22px;
    border: 0;
    border-radius: 14px;
    background: var(--teal-deep);
    color: #fff;
    cursor: pointer;
    transition: background .2s ease, opacity .2s ease;
  }
  button:hover { background: #01585c; }
  button:active { background: #014a4e; }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible { outline: 2px solid var(--teal-deep); outline-offset: 3px; }

  .status {
    margin-top: 16px;
    min-height: 20px;
    font-size: 13px;
    color: var(--muted);
  }
  .status b { color: var(--teal-deep); font-weight: 600; }

  .tips {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    line-height: 2;
    color: var(--muted);
    text-align: start;
    list-style: none;
  }
  .tips li::before { content: "•"; color: var(--teal); margin-inline-end: 8px; }

  @media (prefers-reduced-motion: reduce) {
    .mark span, .wheel { animation: none; }
    .mark span { opacity: .6; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <span></span><span></span><span></span>
      <svg class="logo" viewBox="0 0 249.71 249.71" role="img" aria-label="tmtm">

      </svg>
    </div>

    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p class="lead">تعذّر الوصول إلى المتجر. سلّتك محفوظة — وستُحدَّث هذه الصفحة تلقائيًا فور عودة الاتصال.</p>

    <button type="button" id="retry">إعادة المحاولة</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <ul class="tips">
      <li>تأكّد من إيقاف وضع الطيران</li>
      <li>تحقّق من الواي فاي أو بيانات الجوال</li>
      <li>انتقل إلى مكان بتغطية أفضل</li>
    </ul>
  </main>

<script>
(function () {
  var btn = document.getElementById('retry');
  var status = document.getElementById('status');
  var probing = false;

  function say(html) { status.innerHTML = html; }

  /* navigator.onLine lies (captive portals, "connected" with no route), so the
     only trustworthy signal is a request that actually completes. HEAD on the
     favicon: tiny, and the service worker leaves root-level files alone. */
  function probe() {
    if (probing) return Promise.resolve(false);
    probing = true;
    return fetch('/favicon.ico?p=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { return r.ok; })
      .catch(function () { return false; })
      .then(function (ok) { probing = false; return ok; });
  }

  function reconnected() {
    document.body.classList.add('online');
    say('<b>عاد الاتصال</b> — جارٍ تحديث الصفحة…');
    setTimeout(function () { location.reload(); }, 500);
  }

  btn.addEventListener('click', function () {
    btn.disabled = true;
    say('جارٍ التحقق من الاتصال…');
    probe().then(function (ok) {
      if (ok) return reconnected();
      btn.disabled = false;
      say('لا يزال الاتصال منقطعًا.');
    });
  });

  /* Quiet background polling, backing off 4s → 30s so a phone left on this
     page in a tunnel is not draining its battery on retries. */
  var delay = 4000;
  (function poll() {
    setTimeout(function () {
      probe().then(function (ok) {
        if (ok) return reconnected();
        delay = Math.min(delay * 1.5, 30000);
        poll();
      });
    }, delay);
  })();

  window.addEventListener('online', function () {
    probe().then(function (ok) { if (ok) reconnected(); });
  });

  if (!navigator.onLine) say('في انتظار الاتصال…');
})();
</script>
</body>
</html>
